name: Audit

# Security advisories (RustSec) and yanked crates in Cargo.lock. Kept out of
# CI on purpose: an advisory published against an unchanged dependency should
# raise a flag here, not fail unrelated pull requests or hold back a release.

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group: a push to main must not cancel the
  # nightly advisory scan of the same ref.
  group: audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          arguments: --all-features --locked
