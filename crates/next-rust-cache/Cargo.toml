[package]
name = "next-rust-cache"
description = "Pluggable cache abstraction for Next Rust: in-memory and filesystem stores, tags, revalidation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["next-rust", "cache", "isr", "revalidation"]
categories = ["web-programming", "caching"]
readme = "../../README.md"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "io-util"] }
next-rust-assets.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
