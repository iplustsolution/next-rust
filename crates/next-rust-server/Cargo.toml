[package]
name = "next-rust-server"
description = "The Next Rust runtime: HTTP server, request pipeline, SSR/streaming, ISR, middleware, static files and server actions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["next-rust", "http", "server", "ssr", "web"]
categories = ["web-programming::http-server"]
readme = "../../README.md"

[features]
default = ["compression"]
compression = ["dep:flate2"]
# HTTP/2 over plain TCP (h2c). Browsers use HTTP/2 only over TLS, which a
# proxy terminates, so this is off by default to keep binaries small.
http2 = ["hyper/http2", "hyper-util/http2", "hyper-util/server-auto"]
websocket = ["dep:tokio-tungstenite"]
tracing = ["dep:tracing"]

[dependencies]
next-rust-core.workspace = true
next-rust-router.workspace = true
next-rust-view.workspace = true
next-rust-assets.workspace = true
next-rust-cache.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "fs", "io-util", "macros", "signal", "sync"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["server-graceful", "service", "tokio", "http1"] }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
getrandom.workspace = true
flate2 = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
flate2.workspace = true
