[package]
name = "next-rust-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The browser-side API for Next Rust islands: Rust compiled to WebAssembly, talking to a logic-free JavaScript shim."
categories = ["wasm", "web-programming"]
keywords = ["next-rust", "wasm", "islands", "dom"]
readme = "../../README.md"

# No dependencies, ever. Every crate linked into an island is bytes a browser
# downloads, and `no_std` keeps the module free of the formatting and unwinding
# machinery that `std` pulls in.
[dependencies]

[features]
default = []
# The server-side encoder for the props blob. Off for the browser build; the
# framework turns it on where pages are rendered.
encode = []
