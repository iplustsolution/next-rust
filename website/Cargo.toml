[package]
name = "next-rust-website"
description = "The Next Rust website and documentation, built with Next Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
next-rust = { path = "../crates/next-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
next-rust-build = { path = "../crates/next-rust-build" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
